name: Actualizar Datos MITECO

on:
  schedule:
    - cron: '0 15 * * 2-4'
  workflow_dispatch: # Te pone un botón en GitHub para ejecutarlo a mano cuando quieras

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar mdbtools (necesario para leer el archivo del Ministerio)
        run: sudo apt-get update && sudo apt-get install -y mdbtools

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías de Python
        run: pip install requests pandas rich python-dateutil

      - name: Ejecutar la ETL
        run: python etl/etl.py

      - name: Subir los nuevos datos a GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Añadimos el JSON y el archivo de hash
          git add public/datos_embalses_optimizado.json
          git add last_mdb_hash.txt || true
          
          # Solo hace commit si hay cambios reales
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Nuevos datos hidrológicos" && git push)

      # Publishes the fresh dataset to the Worker's KV so it goes live instantly.
      # Runs after the git commit so data is never lost even if this step fails.
      - name: Publish dataset to the Worker (KV)
        if: always() && hashFiles('public/datos_embalses_optimizado.json') != ''
        env:
          WORKER_UPLOAD_TOKEN: ${{ secrets.WORKER_UPLOAD_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/upload_response.json -w "%{http_code}" \
            -X POST "https://aquaspain.fjmahv.workers.dev/api/upload" \
            -H "Authorization: Bearer $WORKER_UPLOAD_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @public/datos_embalses_optimizado.json)
          cat /tmp/upload_response.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Worker upload failed with HTTP $HTTP_CODE (data is safe in git)"
            exit 1
          fi
